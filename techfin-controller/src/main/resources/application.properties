# ==================== 大模型（OpenAI 兼容协议网关） ====================
# api-key 必填（空值启动失败）；model 必须用 API 支持的名称（写错返回 400，4xx 不重试）
# base-url 只写到主机，请求路径用框架默认的 /v1/chat/completions；base-url 与 model 必须显式配
# （框架默认指向 api.openai.com / gpt-4o-mini）；temperature 不配 = 0.7
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=sk-a0a03cbed1cb4c2a9c5e88ab0f9de1fc
spring.ai.openai.chat.options.model=deepseek-flash

# 重试：max-attempts 是总尝试次数（3 = 首发 1 + 重试 2，退避 1s×2）；4xx 默认不重试，429 属瞬时错误、显式纳入
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.on-http-codes=429

# 超时：read-timeout 按「多久没收到字节」计时，是唯一切断「服务端挂住不发字节」的配置（不配则永不超时，
# 也不会触发重试）；读超时可重试，最坏阻塞 ≈ max-attempts × read-timeout + 退避
# 作用于 Boot 自动装配的 Builder，仅大模型链路在用；DIB 自建 RestClient 不读
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s

# 跳过 TLS 证书校验（默认关闭）：仅大模型链路生效，中间人无法发现，只在内网自签证书时临时开启
# （自签场景优先配 spring.ssl.bundle.pem.<name>.truststore.certificate，用 file: 挂载）
llm.insecure-ssl=false

# 调用方身份透传用的请求头名（值由调用方逐请求传入）
llm.user-id-header=X-User-ID
