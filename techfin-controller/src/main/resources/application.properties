#dib平台api配置
#dib.base-url=https://137259fd-1e69-47c3-84c5-f1207e1bba74.mock.pstmn.io
dib.base-url=http://localhost:9090
dib.attachment-upload-url=${dib.base-url}/api/mdm/open/att/upload
dib.doc-batch-add-url=${dib.base-url}/api/extract/open/doc/batch/add
dib.doc-detail-url=${dib.base-url}/api/extract/open/doc/get
dib.doc-query-data-url=${dib.base-url}/api/extract/open/doc/queryData
dib.doc-export-data-url=${dib.base-url}/api/extract/open/doc/exportDocData
dib.doc-table-extract-state-url=${dib.base-url}/api/extract/open/doc/docTableExtractState
dib.doc-delete-url=${dib.base-url}/api/extract/open/doc/delete
# 响应超时（秒）：等待响应 / 读响应体的空闲上限（上传的写请求体阶段不受它约束）
# 上传 60s：要宽容，等 DIB 收完 multipart（单文件可达 50MB）
# 下载 30s：要能快速失败。单份最坏 = 等池(3) + 建连(5) + 30 = 38s，网关 60s 下留 22s 余量
#           （导出物是几百 KB 的 xlsx，正常只有几百毫秒，30s 已极宽松）
# 轻量接口 10s：实测秒级，10s 已远超正常值。这一档被串行放大最多（×9）
#              单份最坏 = 等池(3) + 建连(5) + 10 = 18s
dib.file-timeout-seconds=60
dib.download-timeout-seconds=30
dib.api-timeout-seconds=10
# ---------- 连接池（Apache HttpClient 5，upload / download / api 各一个独立池）----------
# 只有这 4 项可配；等池超时 / 复用前校验 / TTL / 总连接上限是 RestClientConfig 里的常量
# 建连超时（秒），三个 client 共用。DIB 走 http，这一段只有 TCP + DNS，5s 余量已很足
# ⚠️ HC5 里 0 = 无限等待，别写 0
dib.pool.connect-timeout-seconds=5
# 上传池的单主机连接上限 = 并发上传数上限 = 堆占用上限（单文件 50MB，4 并发≈200MB）
dib.pool.file-max-per-route=4
# 下载池的单主机连接上限；导出是用户点击触发的低频操作，4 个连接已很富余
dib.pool.download-max-per-route=4
# api 池的单主机连接上限；调大前先确认 DIB 允许的并发配额，否则会引来 429
dib.pool.api-max-per-route=10
