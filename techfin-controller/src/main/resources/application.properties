server.port=8080
server.servlet.context-path=/techfin

# 文件上传限制（超过此大小会在 multipart 解析阶段被拒绝，不会到达业务校验）
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.application.name=techfin-platform-ai

spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=qiu
spring.datasource.password=Qiu@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

# 文件上传限制
file.upload.max-file-size=52428800
# 外部 API 上传超时时间（秒）
file.upload.timeout-seconds=120
# 财报类文档允许的扩展名
file.upload.allowed-extensions.finance=pdf,doc,docx,xls,xlsx,csv,jpg,jpeg,png
# 商业计划书类文档允许的扩展名
file.upload.allowed-extensions.business=pdf,doc,docx,ppt,pptx,jpg,jpeg,png

