# ==================== 大模型（DeepSeek，OpenAI 兼容协议） ====================
# ⚠️ api-key 必填：未配置 / 空串 / 纯空白都会让应用【启动直接失败】
# ⚠️ model 必须用 API 支持的名称（写错返回 400，属 4xx 不重试直接失败）：V4.1-Flash 的 API 名是 deepseek-flash
# base-url 只写到主机；实际请求 URL = base-url + 框架默认路径 /v1/chat/completions（已实测 HTTP 200）
# base-url 与 model 必须显式配（框架默认指向 api.openai.com 与 gpt-4o-mini）；temperature 不配 = 框架默认 0.7

spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=sk-a0a03cbed1cb4c2a9c5e88ab0f9de1fc
spring.ai.openai.chat.options.model=deepseek-flash

# ---------- 重试 ----------
# max-attempts 是【总尝试次数】而非重试次数：3 = 首发 1 次 + 重试 2 次；4xx 默认不重试，5xx 按此次数重试
# （框架默认 10 次 / 2s 起步 / 5 倍退避，最坏占住线程好几分钟）。退避 1s×2 = 两次重试前共等 3s
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
# 不配 backoff.max-interval：上限要到第 4 个 sleep 才起作用，3 次尝试够不到（调到 5 次以上再加）
# 429 属 4xx，默认落进「不重试」分支，这里显式纳入；DeepSeek 的 429 = 并发超限（在途请求结束即恢复），属瞬时错误
spring.ai.retry.on-http-codes=429

# ---------- 超时 ----------
# ⚠️ read-timeout 是唯一能切断「服务端挂住不发字节」的配置：不配时 HC5 的 socketTimeout=null（永不超时），
#    读不返回就不抛异常、也就不会触发重试。读超时算可重试失败 → 最坏阻塞 ≈ max-attempts × read-timeout + 退避
# ⚠️ 它按「多久没收到字节」计时，不是整次调用的总时长：DeepSeek 排队时会持续回空行（keep-alive）重置计时，
#    服务端自己在 10 分钟未开始推理时断连 —— 长生成不会被我们切断，但接业务后仍要按真实耗时复校
# connect-timeout 与 DIB 侧对齐取 5s：HC5 默认建连 3 分钟，且建连失败同样会重试 3 次
# 这两项作用于 Boot 自动装配的 Builder，目前只有大模型链路在用；DIB 自建 RestClient 不读它
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=60s

# ---------- 跳过 TLS 证书校验（默认关闭）----------
# 仅大模型链路生效：开启 = 不校验证书链与主机名，中间人无法发现，只在内网自签证书时临时用。
# 当前 api.deepseek.com 由 DigiCert 签发，JDK 默认信任库直接认（已实测握手成功），无需开启；
# 若换成自签证书的内网网关，优先配 spring.ssl.bundle.pem.<name>.truststore.certificate（用 file: 挂载，别用 classpath:）
llm.insecure-ssl=false

# 调用方身份透传用的请求头【名】；身份值由调用方逐请求传入，写不进配置文件
llm.user-id-header=X-User-ID
